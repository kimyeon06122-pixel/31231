    <!-- Fonts Loading -->
    <!-- 1. Noto Sans KR (Reliable Fallback from Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- 2. Pretendard (Primary Font via JSDelivr CDN) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              // Priority: Pretendard -> Noto Sans KR -> System Default
              sans: ['Pretendard', 'Noto Sans KR', 'sans-serif'],
            },
          },
        },
      }
    </script>

    <style>
      body {
        font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        background-color: #FFFFFF; /* Pure White base */
        color: #111827; /* Gray 900 */
        -webkit-font-smoothing: antialiased;
      }
      /* Hide scrollbar for clean horizontal scrolling */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
